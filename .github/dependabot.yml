version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # @types/node follows the Node.js major in .nvmrc, not the newest types.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # The API image's base (deploy-api-skeleton design decision 5).
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    # The base image follows the Node.js major in .nvmrc, as @types/node does.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
