name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# nrwl/nx-set-shas lists earlier workflow runs to find the last successful
# base on main.
permissions:
  contents: read
  actions: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # tools/change-scope is the one declaration of what is
      # documentation-only (scaffold-workspace design decision 11). It runs
      # on Node alone, and anything it does not answer cleanly is `full`.
      - name: Judge the change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          verdict=full
          if [ "$EVENT" = pull_request ]; then
            if changed=$(git diff --name-only --no-renames "$BASE...$HEAD") &&
              answer=$(printf '%s\n' "$changed" | node tools/change-scope/src/docs-only.ts) &&
              { [ "$answer" = docs-only ] || [ "$answer" = full ]; }; then
              verdict=$answer
            else
              echo "Could not judge the change (tools/change-scope failed); running the full checks."
            fi
          fi
          echo "verdict: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - name: Project checks stood down
        if: steps.scope.outputs.verdict == 'docs-only'
        run: echo "Documentation-only change; nx sync:check and nx affected (lint, typecheck, test, integration, build, e2e) not run."

      - name: nx sync:check
        if: steps.scope.outputs.verdict != 'docs-only'
        run: pnpm nx sync:check

      - name: nx affected
        if: steps.scope.outputs.verdict != 'docs-only'
        run: pnpm nx affected -t lint typecheck test integration build e2e

      - run: pnpm format:check

      - run: pnpm audit --audit-level high

      - run: pnpm exec openspec validate --all --strict --no-interactive

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release binary rather than gitleaks-action, which needs a paid
      # licence for repositories owned by an organisation.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose'

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
