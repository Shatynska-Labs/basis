name: Deploy

# Builds, pushes and deploys the API once CI has succeeded on a push to main,
# from the commit CI judged (deploy-api-skeleton design decision 8).
# `workflow_run` runs this file as it is on the default branch, so a pull
# request cannot alter what deploys. Under this trigger the run's own commit
# context is the default branch's tip when the run starts, not the commit CI
# judged, so it is never read here: every ref, tag and version takes
# `github.event.workflow_run.head_sha`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

env:
  # Lowercase literal: must match deploy/api/docker-compose.yml and the
  # `basis-api` entry in the infrastructure repository's deploy_apps.
  IMAGE_NAME: ghcr.io/shatynska-labs/basis-api

jobs:
  build-and-push:
    name: Build and push image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit's tag only: no floating `latest`, a second name for an
      # image the host already keeps by the tag Compose references.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys arrive in the order their CI runs finish, not in commit order.
  # A commit main has moved past delivers nothing, so production never goes
  # back to a superseded commit; a re-run is exempt, since re-running an older
  # run is the rollback. The guard runs twice. Here, before the deploy job asks
  # for its concurrency group: GitHub keeps one pending job per group and a
  # newly queued one cancels it, so a superseded commit that queued would
  # cancel the newer commit's pending deploy and then skip itself, leaving
  # main's head undeployed. Skipped here, it never queues. And again in the
  # deploy job, once it holds the group, for a newer commit that delivered
  # while this one waited.
  supersession:
    name: Skip a superseded commit
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deliver: ${{ steps.superseded.outputs.deliver }}
    steps:
      - &superseded-guard
        name: Skip a superseded commit
        id: superseded
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            echo "::notice::Re-run (attempt $RUN_ATTEMPT): deploying $HEAD_SHA whatever main's head is."
            echo "deliver=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(git ls-remote "$REMOTE" refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::Could not read refs/heads/main from $REMOTE."
            exit 1
          fi
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::main is now at $tip, so $HEAD_SHA is superseded and is not deployed; the newer commit's own run deploys it once its CI succeeds."
            echo "deliver=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deliver=true" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy (production)
    needs: supersession
    if: needs.supersession.outputs.deliver == 'true'
    runs-on: ubuntu-latest
    environment: production
    # No two deploys overlap, and none in progress is cancelled. Only the
    # supersession job above keeps a superseded commit from queueing here.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - *superseded-guard

      - name: Refuse without the production secrets
        if: steps.superseded.outputs.deliver == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          BASIS_API_DEPLOY_SSH_KEY: ${{ secrets.BASIS_API_DEPLOY_SSH_KEY }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          missing=''
          for name in DEPLOY_HOST BASIS_API_DEPLOY_SSH_KEY TAILSCALE_OAUTH_CLIENT_ID TAILSCALE_OAUTH_SECRET; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The production Environment lacks:$missing. Nothing was joined or delivered."
            exit 1
          fi

      - if: steps.superseded.outputs.deliver == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # SSH to the host is reachable only over the tailnet.
      - name: Connect to the tailnet
        if: steps.superseded.outputs.deliver == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      # The escaping rule is the infrastructure repository's, copied from its
      # platform-deploy.yml: each value double-quoted with `\` -> `\\`,
      # `"` -> `\"` and `$` -> `$$`, in that order. Every value written into
      # the file goes through render(), so one added later is escaped by
      # construction. Values arrive through `env:`, never as `${{ }}` text in
      # this body, and the escaped form is never printed.
      - name: Render .env
        if: steps.superseded.outputs.deliver == 'true'
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          umask 077
          render() {
            local name="$1"
            local value="$2"
            local escaped="$value"
            escaped="${escaped//\\/\\\\}"
            escaped="${escaped//\"/\\\"}"
            escaped="${escaped//\$/\$\$}"
            printf '%s="%s"\n' "$name" "$escaped"
          }
          {
            render IMAGE_TAG "$IMAGE_TAG"
          } >deploy/api/.env

      # The host's forced command reads the archive, then runs
      # `docker compose pull && docker compose up -d --wait`, so this step
      # fails unless the service becomes healthy.
      - name: Deliver and deploy
        if: steps.superseded.outputs.deliver == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.BASIS_API_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" >"$key")
          ssh-keyscan -T 15 "$DEPLOY_HOST" >"$known_hosts"
          tar -czf - -C deploy/api docker-compose.yml .env \
            | ssh -i "$key" \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$known_hosts" \
                "deploy@${DEPLOY_HOST}"

      # A warning, never a failure: before DNS and the certificate exist the
      # public URL cannot answer, and the host-side `--wait` has already
      # judged health.
      - name: Check the public health report
        if: steps.superseded.outputs.deliver == 'true'
        env:
          URL: https://api.basis.shatynska.com/health
          EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          attempts="${POLL_ATTEMPTS:-8}"
          interval="${POLL_INTERVAL:-10}"
          version=''
          # Eight attempts of at most 5 s, 10 s apart: under two minutes.
          for attempt in $(seq 1 "$attempts"); do
            if body=$(curl -fsS --max-time 5 "$URL"); then
              version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
              if [ "$version" = "$EXPECTED_VERSION" ]; then
                echo "$URL reports version $version."
                exit 0
              fi
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$interval"
            fi
          done
          if [ -n "$version" ]; then
            echo "::warning::$URL reports version '$version', not $EXPECTED_VERSION."
          else
            echo "::warning::$URL did not answer (DNS or the certificate may still be pending)."
          fi
          exit 0
