name: Deploy

# Builds and pushes the API once CI has succeeded on a push to main, from the
# commit CI judged, and deploys it to staging, and only there
# (deploy-api-skeleton design decision 8; move-api-deploys-to-staging-with-
# promotion design decision 1). Production is reached by promote.yml alone.
# `workflow_run` runs this file as it is on the default branch, so a pull
# request cannot alter what deploys. Every ref, tag and version takes
# `github.event.workflow_run.head_sha`, the commit CI judged; the run's own
# commit is read once, by the deliver-stage guard, because it is the commit
# GitHub records the staging deployment under (design decision 4).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

env:
  # Lowercase literal: must match deploy/api/docker-compose.yml and the
  # `basis-api` entries in the infrastructure repository's deploy_apps.
  IMAGE_NAME: ghcr.io/shatynska-labs/basis-api

jobs:
  build-and-push:
    name: Build and push image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit's tag only, which is how a promotion finds this commit's
      # image; what deploys is the digest (design decision 2).
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys arrive in the order their CI runs finish, not in commit order, and
  # a commit main has moved past delivers nothing (design decision 5). Checked
  # here first, before the deploy job asks for its concurrency group: GitHub
  # keeps one pending job per group and a newly queued one cancels it, so a
  # superseded commit that queued would cancel the newer commit's pending
  # deploy and then end itself, leaving main's head undeployed. Skipped here,
  # the deploy job never starts and leaves no staging record.
  supersession:
    name: Skip a superseded commit
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deliver: ${{ steps.superseded.outputs.deliver }}
      digest: ${{ needs.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Skip a superseded commit
        id: superseded
        env:
          STAGE: skip
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: node tools/delivery/src/supersession.ts

  deploy:
    name: Deploy (staging)
    needs: supersession
    if: needs.supersession.outputs.deliver == 'true'
    runs-on: ubuntu-latest
    environment: staging
    # No two staging deploys overlap, and none in progress is cancelled. Only
    # the supersession job above keeps a superseded commit from queueing here.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Again, once this job holds the group, for a newer commit that
      # delivered while this one waited. This one fails rather than skips: a
      # job ending successfully here would record a staging success for a
      # commit staging never ran, which the promotion's gate would admit. It
      # also fails when the run's own commit, the one GitHub records this
      # deployment under, is not the commit about to be delivered.
      - name: Refuse a superseded commit
        env:
          STAGE: deliver
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUN_COMMIT: ${{ github.sha }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: node tools/delivery/src/supersession.ts

      # The host's tailnet address and the tailnet client are organisation
      # settings, shared by every application deploying to that host; the
      # deploy key is this application's own, a secret of the staging
      # Environment.
      - uses: ./.github/actions/deliver-api
        with:
          target: staging
          deploy-host: ${{ vars.MAIN_STAGING_DEPLOY_HOST }}
          deploy-ssh-key: ${{ secrets.BASIS_API_DEPLOY_SSH_KEY }}
          tailscale-oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          base-domain: ${{ vars.BASE_DOMAIN }}
          image-digest: ${{ needs.supersession.outputs.digest }}
          commit: ${{ github.event.workflow_run.head_sha }}
          compose-dir: deploy/api
