# What each host runs from /opt/basis-api, delivered with a rendered .env by
# the deliver-api action: on a merge to staging, by a promotion to production
# (deploy-api-skeleton design decision 6, move-api-deploys-to-staging-with-
# promotion design decisions 2 and 3). The image is pinned by digest and the
# router rule is built from the host's server name and the base domain, so one
# file serves both hosts and names neither. Before the API starts, `migrate`
# applies the API's migrations to its database in the host's shared PostgreSQL
# instance, once, from the same image; a failed migration fails the host's
# `docker compose up -d --wait`, so the delivery fails (add-persistence-
# skeleton design decision 3). Nothing is persisted on the host: neither
# service has a volume.
services:
  migrate:
    image: ghcr.io/shatynska-labs/basis-api@${IMAGE_DIGEST:?IMAGE_DIGEST is not rendered}
    command: [node, dist/migrate.js]
    restart: 'no'
    init: true
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    # The image's HEALTHCHECK is the API's, and means nothing for a one-shot.
    healthcheck:
      disable: true
    networks: [platform_edge]

  api:
    image: ghcr.io/shatynska-labs/basis-api@${IMAGE_DIGEST:?IMAGE_DIGEST is not rendered}
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [platform_edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.basis-api.rule=${ROUTER_RULE:?ROUTER_RULE is not rendered}
      - traefik.http.services.basis-api.loadbalancer.server.port=3000

networks:
  platform_edge:
    external: true
