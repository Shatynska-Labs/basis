# What each host runs from /opt/basis-api, delivered with a rendered .env by
# the deliver-api action: on a merge to staging, by a promotion to production
# (deploy-api-skeleton design decision 6, move-api-deploys-to-staging-with-
# promotion design decisions 2 and 3). The image is pinned by digest and the
# router rule is built from the host's server name and the base domain, so one
# file serves both hosts and names neither. Nothing is persisted: the service
# has no volume.
services:
  api:
    image: ghcr.io/shatynska-labs/basis-api@${IMAGE_DIGEST:?IMAGE_DIGEST is not rendered}
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [platform_edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.basis-api.rule=${ROUTER_RULE:?ROUTER_RULE is not rendered}
      - traefik.http.services.basis-api.loadbalancer.server.port=3000

networks:
  platform_edge:
    external: true
