packages:
  - 'apps/*'
  - 'libs/**'
  - 'tools/*'

allowBuilds:
  '@swc/core': true
  nx: true
  # Declined (add-persistence-skeleton design decision 8). Testcontainers
  # reaches Docker over its socket, needing neither ssh2's optional native
  # crypto (cpu-features, ssh2) nor protobufjs's postinstall notice; esbuild,
  # reached through drizzle-kit, runs from its platform package without its
  # postinstall check.
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
engineStrict: true
saveExact: true

overrides:
  # nx 23.3.0 pins undici 7.29.0, which GHSA-rfgv-xxqx-mfg5 and
  # GHSA-w293-vg96-wgc3 affect; 7.29.1 fixes both. Drop this once nx
  # depends on a fixed undici.
  undici@7.29.0: 7.30.1
  # @nestjs/platform-express 12.1.3 pins multer 2.4.0, which
  # GHSA-q7qp-rjg7-q26m affects, as 12.2.0 still does; 2.5.0 fixes it. Drop
  # this once @nestjs/platform-express depends on a fixed multer.
  multer@2.4.0: 2.5.0

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, stack exhaustion on deeply nested patterns: no fixed
    # release exists. Reached only through @fission-ai/openspec (fast-glob,
    # micromatch), a development tool globbing this repository's own paths.
    - GHSA-vfj7-8cjw-p6xm
